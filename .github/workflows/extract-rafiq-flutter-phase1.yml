name: Extract Rafiq AlQuran Flutter Phase 1 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive without deleting or overwriting existing files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="rafiq_al_quran_flutter_phase1.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Archive not found at repository root: $ZIP"
            exit 1
          fi

          mkdir -p /tmp/rafiq-phase1-extract
          unzip -q "$ZIP" -d /tmp/rafiq-phase1-extract

          shopt -s dotglob nullglob
          entries=(/tmp/rafiq-phase1-extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SOURCE="${entries[0]}"
          else
            SOURCE="/tmp/rafiq-phase1-extract"
          fi

          # Preserve all current files. Only add paths that do not already exist.
          cp -an "$SOURCE"/. .
          git status --short

      - name: Commit newly extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new files to add; existing repository was left unchanged."
            exit 0
          fi
          git commit -m "Extract Rafiq AlQuran Flutter Phase 1 ZIP"
          git push
